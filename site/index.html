<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Add invisible AI canary prompts to a PDF in your browser."
    >
    <title>PDF Canary</title>
    <link rel="stylesheet" href="styles.css">
    <script
      src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"
      integrity="sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAI"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>PDF Canary</h1>
      <p>Add invisible AI canaries to a PDF. The file stays in your browser.</p>

      <form id="canary-form">
        <label for="pdf-file">PDF file</label>
        <input id="pdf-file" name="pdf" type="file" accept="application/pdf,.pdf" required>
        <button type="submit">Add canaries</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>

      <section id="result" hidden>
        <p>Canary phrase: <code id="phrase"></code></p>
        <a id="download">Download PDF</a>
      </section>
    </main>
  </body>
</html>
