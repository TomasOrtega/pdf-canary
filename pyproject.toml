[project]
name = "pdf-canary"
version = "0.1.0"
description = "Add invisible AI canary prompts to PDF files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
]

[dependency-groups]
dev = [
    "prek>=0.4.14",
    "pytest>=8.4",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
